<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <!-- Path to style.css relative to homepage/index.html -->
    <link rel="stylesheet" href="../homepage/">
    <!-- Path to homepage.css relative to homepage/index.html -->
    <link rel="stylesheet" href="../homepage/style.css">
</head>
<body>
    <header>
        <h1>Sanction Bullshit</h1>
        <div class="nav-links">
            <!-- Dashboard link (hidden by default, shown when logged in) -->
            <a href="../dashboard/dashboard.html" target="_blank" id="dashboardNavLink" style="display: none;">Dashboard</a>
            <!-- Login link (shown by default, hidden when logged in) -->
            <a href="../login/login.html" target="_blank" id="loginLink" style="display: none;">Login</a>
            <a href="./index.html" target="_blank">List</a> <!-- Current page, also opens in new tab -->
            <a href="../logs/logs.html" target="_blank">Logs</a>
            <a href="../transactions/transactions.html" target="_blank">Transactions</a>
            <!-- Logout link (hidden by default, shown when logged in) -->
            <a href="#" id="logoutLink" class="ml-4 text-red-300 hover:text-red-100 font-bold" style="display: none;">Logout</a>
        </div>
    </header>

    <div class="filter-container">
        <input type="text" id="filterSearchTerm" placeholder="Search term..." class="filter-input">
        <select id="filterType" class="filter-select">
            <option value="name">Name</option>
            <option value="id">ID</option>
            <option value="program">Program</option>
            <option value="set_year">Set-Year</option> <!-- NEW FILTER OPTION -->
            <option value="level">Level</option>     <!-- NEW FILTER OPTION -->
        </select>
        <button id="applyFilterBtn" class="filter-button">Apply Filter</button>
        <button id="clearFilterBtn" class="filter-button clear-button">Clear Filter</button>
    </div>

    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Program</th>
                    <th>Set-Year</th>
                    <th>Level</th>
                    <th>Email</th>
                    <th>Actions</th> <!-- This column will now contain Send, Delete, Edit/Save/Cancel, and Approve buttons -->
                </tr>
            </thead>
            <tbody id="recordsTableBody">
                <tr><td colspan="7">Loading records...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Approve Modal Structure -->
    <div id="approveModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Approve Sanction</h2>
            <p>How was the sanction resolved for <span id="modalStudentName" style="font-weight: bold;"></span> (ID: <span id="modalStudentId" style="font-weight: bold;"></span>)?</p>
            <div class="flex-buttons">
                <button id="payOptionBtn">Pay</button>
                <button id="communityServiceOptionBtn">Community Service</button>
            </div>
            <button id="cancelApproveBtn">Cancel</button>
        </div>
    </div>

    <script src="../homepage/list_scripts.js"></script>
    <script>
        // JavaScript to conditionally show/hide navigation links based on login status
        document.addEventListener('DOMContentLoaded', function() {
            const dashboardNavLink = document.getElementById('dashboardNavLink');
            const loginLink = document.getElementById('loginLink');
            const logoutLink = document.getElementById('logoutLink');
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

            if (dashboardNavLink) {
                dashboardNavLink.style.display = isLoggedIn ? 'inline-block' : 'none';
            }
            if (loginLink) {
                loginLink.style.display = isLoggedIn ? 'none' : 'inline-block';
            }
            if (logoutLink) {
                logoutLink.style.display = isLoggedIn ? 'inline-block' : 'none';
            }
        });
    </script>
</body>
</html>
